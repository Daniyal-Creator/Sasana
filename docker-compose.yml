# Local development for the BACKEND ONLY.
#
# The frontend deliberately stays out of Docker: Next.js file watching through a
# Windows bind mount is unreliable, and the frontend developers depend on fast
# HMR. Run it natively with `npm run dev` inside frontend/.

# Pinned. The project name is Compose's namespace - it prefixes the container
# names, the network and any volume - so a renamed or relocated folder would
# otherwise quietly point at a different set of them, and a developer's cached
# answers would look lost when they are merely somewhere else.
#
# There is no production compose file to keep apart from any more: production is
# Vercel, and there is no container in it (ADR-0018). This file is for laptops.
name: sasana-dev

services:
  backend:
    build:
      # The context is the repository root, not ./backend, so the image can copy
      # shared/ - the type-only API contract lives outside the backend folder.
      context: .
      dockerfile: backend/Dockerfile
    # Real values (the Gemini key) come from here. This file is git-ignored;
    # copy backend/.env.example to backend/.env and fill in your own key.
    env_file: ./backend/.env
    environment:
      PORT: 3001
      # ALLOWED_ORIGINS is deliberately NOT set here. It used to be, pinned to
      # http://localhost:3000, and that was a trap: Compose's `environment:`
      # overrides `env_file:`, so setting the variable in backend/.env — the file
      # backend/.env.example tells you to set it in — had no effect at all. The
      # deployed API allowed only localhost while its own frontend was refused,
      # and nothing on the server said why.
      #
      # Left unset, the value comes from backend/.env like every other setting,
      # and src/app.ts falls back to http://localhost:3000 when that is empty —
      # so a laptop still needs no configuration.
      # Interpolated so the answer cache can be turned off for one run without
      # editing this file:
      #
      #   CACHE_ENABLED=false docker compose up -d backend
      #
      # Misses are still counted with it off, which is what makes a cold run and
      # a warm run comparable. See docs/adr/0016.
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    # Resolvers for this container, overridable per machine.
    #
    # Why this is here at all: on the school server every call to the AI
    # provider died as `TypeError: fetch failed` after a flat ~2s, while the
    # same image on a laptop reached the same hosts without trouble, and the
    # container's Postgres connection to Supabase kept working throughout. A
    # flat two seconds is the shape of a resolver giving up, not of a refused
    # connection — and this image is Alpine, whose musl resolver queries A and
    # AAAA together and is less forgiving of a slow or truncated reply than the
    # glibc resolver most machines run.
    #
    # Overridable because forcing a public resolver is exactly wrong on some
    # networks. A corporate VPN, or any network that answers only through its
    # own DNS and blocks port 53 outbound, would lose name resolution
    # completely — including Supabase, which works today. Anyone in that
    # position sets DNS_PRIMARY and DNS_FALLBACK to their own resolvers, or
    # comments this block out to go back to Docker's embedded DNS.
    #
    # Service discovery survives this. The container still points at Docker's
    # embedded resolver on 127.0.0.11 — verified in /etc/resolv.conf after the
    # change — and only its upstream moves, so a container looked up by name
    # would still be found. This setting redirects what the embedded resolver
    # cannot answer itself, nothing more.
    dns:
      - ${DNS_PRIMARY:-8.8.8.8}
      - ${DNS_FALLBACK:-1.1.1.1}
    ports:
      - "3001:3001"
    # Source is mounted so `tsx watch` picks up edits without rebuilding the
    # image. node_modules stays inside the container.
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared:/app/shared
      # The answer cache's SQLite file. Bind-mounted rather than named so a
      # developer can open it, and git-ignored so it never gets committed.
      - ./backend/data:/app/backend/data
    command: npm run dev
    healthcheck:
      # The script must stay quoted: unquoted, YAML reads the "? " and ": " in
      # the ternary as mapping syntax instead of as part of the string.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
