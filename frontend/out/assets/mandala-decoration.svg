<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" stroke="#2A2520" stroke-width="0.5" opacity="1">
  <!-- Abstract mandala: concentric geometric rings, purely mathematical -->
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="180" />
  <circle cx="200" cy="200" r="170" />
  <!-- Petal ring outer -->
  <path d="M200 30 Q230 80 200 100 Q170 80 200 30" />
  <path d="M200 370 Q230 320 200 300 Q170 320 200 370" />
  <path d="M30 200 Q80 170 100 200 Q80 230 30 200" />
  <path d="M370 200 Q320 170 300 200 Q320 230 370 200" />
  <!-- Diagonal petals -->
  <path d="M80 80 Q120 100 110 130 Q90 110 80 80" />
  <path d="M320 80 Q280 100 290 130 Q310 110 320 80" />
  <path d="M80 320 Q100 280 130 290 Q110 310 80 320" />
  <path d="M320 320 Q280 300 290 270 Q310 290 320 320" />
  <!-- Middle ring -->
  <circle cx="200" cy="200" r="120" />
  <circle cx="200" cy="200" r="110" />
  <!-- Inner geometric star -->
  <path d="M200 90 L220 180 L310 180 L235 225 L260 310 L200 260 L140 310 L165 225 L90 180 L180 180 Z" />
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="70" />
  <circle cx="200" cy="200" r="60" />
  <!-- Innermost petals -->
  <path d="M200 140 Q215 170 200 185 Q185 170 200 140" />
  <path d="M200 260 Q215 230 200 215 Q185 230 200 260" />
  <path d="M140 200 Q170 185 185 200 Q170 215 140 200" />
  <path d="M260 200 Q230 185 215 200 Q230 215 260 200" />
  <!-- Center dot -->
  <circle cx="200" cy="200" r="8" />
  <circle cx="200" cy="200" r="4" fill="#2A2520" />
</svg>
